# Netlify: build the Vite app and publish the built files, not the source.
[build]
  command = "npm run build"
  publish = "dist"

# Send app routes like /app to index.html (single-page app). Real files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Installed apps should always pick up a new service worker and manifest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Built assets have hashed names, so they can be cached for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
